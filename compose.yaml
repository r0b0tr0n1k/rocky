# compose.yaml — local development for the Rocky pnpm monorepo.
#
# Build context is the MONOREPO ROOT: each apps/*/Dockerfile copies the root
# lockfile + workspace file and runs `pnpm -r --filter <svc>... build`, so the
# context MUST stay at the repo root (not apps/<svc>).
#
# Dev services run `pnpm install` at container start on purpose: the named
# node_modules volume shadows the install baked into the image, so the running
# container would otherwise have no node_modules. Source is bind-mounted for
# hot reload; node_modules and .next use named volumes to survive restarts.

name: rocky-dev

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    init: true
    environment:
      NODE_ENV: development
      HOSTNAME: 0.0.0.0
      API_URL: http://api:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/apps/web/.next
    depends_on:
      - api
    command: sh -c "pnpm install && pnpm --filter web exec next dev --turbopack --port 3000 --hostname 0.0.0.0"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  docs:
    build:
      context: .
      dockerfile: apps/docs/Dockerfile
      target: development
    init: true
    environment:
      NODE_ENV: development
      HOSTNAME: 0.0.0.0
    ports:
      - "3002:3002"
    volumes:
      - .:/app
      - docs_node_modules:/app/node_modules
      - docs_next:/app/apps/docs/.next
    command: sh -c "pnpm install && pnpm --filter docs exec next dev --turbopack --port 3002 --hostname 0.0.0.0"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    init: true
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 8000
      DATABASE_URL: postgresql://postgres:postgres@database:5432/app_db
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    depends_on:
      database:
        condition: service_healthy
    # apps/api has NO `start:dev` script, so use `dev` (node scripts/dev.mjs).
    command: sh -c "pnpm install && pnpm --filter @rocky/api dev"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  web_node_modules:
  web_next:
  docs_node_modules:
  docs_next:
  api_node_modules:
  postgres_data:
