# ── Domain model ─────────────────────────────────────────────
# ROCKY_DOMAIN is the TERTIARY root the app is served from, e.g.
# tehno.party. Hosts become api./admin./docs.ROCKY_DOMAIN.
#
# ── Security model ──────────────────────────────────────────
# Services expose ports to the host for local development.
# Every app container is also reachable via the Cloudflare Tunnel
# (cloudflared), which joins the same bridge network and proxies
# by service name. Configure public hostnames in Cloudflare Zero
# Trust Dashboard > Networks > Tunnels > your-tunnel > Public Hostname.

services:
  # ── PostgreSQL + PostGIS ───────────────────────────────────────
  db:
    container_name: rokidb
    image: postgis/postgis:18-3.6-alpine
    # Bundled DB. Runs by default (profiles are off). For an EXTERNAL DB,
    # set DATABASE_URL (root .env) to that host and this service is unused.
    # profiles: [local-db]
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=tbot
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=tbot
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tbot -d tbot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - iotn-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # ── NestJS API (tRPC + better-auth) ──────────────────────────
  api:
    container_name: rocky-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8080:8000"
    environment:
      - NODE_ENV=production
      - PORT=8000
      - API_PORT=8000
      # Database — app + Postgres share the POSTGRES_PASSWORD secret
      # Single source of truth: Postgres understands ONE parameter — the
      # connection string. Inherited verbatim from .env (dev: 192.168.1.109;
      # prod: localhost or db). Single var, passed through verbatim.
      - DATABASE_URL=${DATABASE_URL}
      # ── Domain (single source) ──
      # ROCKY_DOMAIN is the tertiary root; hosts become api./admin./docs.<domain>.
      # Every auth/origin var below derives from it by default. Override any one
      # explicitly (e.g. CORS_ORIGINS) only for a non-standard topology.
      - ROCKY_DOMAIN=${ROCKY_DOMAIN:-tehno.party}
      # Auth
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      # Public API origin — external https required for Secure shared cookies.
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-https://api.${ROCKY_DOMAIN:-tehno.party}}
      # Internal server-to-server base URL (Next.js SSR -> API).
      - BASE_SERVICE_URL=${BASE_SERVICE_URL:-https://api.${ROCKY_DOMAIN:-tehno.party}}
      # Shared parent cookie domain: api./admin./docs. share the session.
      - AUTH_COOKIE_DOMAIN=${AUTH_COOKIE_DOMAIN:-.${ROCKY_DOMAIN:-tehno.party}}
      # Admin/public origin the browser runs on (CSRF + CORS trust).
      - AUTH_BASE_URL=${AUTH_BASE_URL:-https://${ROCKY_DOMAIN:-tehno.party}}
      # CORS: admin origin (browser). Override CORS_ORIGINS on a VM.
      - CORS_ORIGINS=${CORS_ORIGINS:-https://${ROCKY_DOMAIN:-tehno.party}}
      - TRUSTED_ORIGINS=${TRUSTED_ORIGINS:-https://${ROCKY_DOMAIN:-tehno.party},mobile://}
      # App
      - VERSION=${VERSION:-production}
      - ENVIRONMENT=production
      # MapTiler key: api generates server-side static maps/geocoding. The
      # single MapTiler key lives in .env as NEXT_PUBLIC_MAPTILER_API_KEY
      # (also inlined into the web build); alias it here rather than
      # duplicating the value as a second .env var.
      - MAPTILER_API_KEY=${NEXT_PUBLIC_MAPTILER_API_KEY}
    # Liveness: handled by the image HEALTHCHECK (Dockerfile) — probes GET /health
    # via node, since the distroless runtime ships no curl/nc.
    restart: unless-stopped
    networks:
      - iotn-network

  # ── Next.js Admin Panel ──────────────────────────────────────
  web:
    container_name: rocky-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Inlined at build (browser). Defaults to the Cloudflare api domain.
        - NEXT_PUBLIC_API_URL=${WEB_PUBLIC_API_URL:-https://api.${ROCKY_DOMAIN:-tehno.party}}
    ports:
      - "3050:3000"
    environment:
      - NODE_ENV=production
      # SSR: Next.js server calls the API via the SAME single HTTPS route the
      # browser uses (NEXT_PUBLIC_API_URL). One trpc route to the server.
      - ROCKY_DOMAIN=${ROCKY_DOMAIN:-tehno.party}
      # SSR: Next.js server calls the API via the SAME single HTTPS route the
      # browser uses (NEXT_PUBLIC_API_URL). One trpc route to the server.
      - API_URL=${WEB_PUBLIC_API_URL:-https://api.${ROCKY_DOMAIN:-tehno.party}}
      # Auth secret (same as API, for server-side session validation)
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      # Public base URL of the auth server (Cloudflare admin domain)
      - AUTH_BASE_URL=${AUTH_BASE_URL:-https://${ROCKY_DOMAIN:-tehno.party}}
    depends_on:
      api:
        condition: service_healthy
    # Liveness: Next.js serves on 3000.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "require(''net'').createConnection(3000,''localhost'').on(''connect'',()=>process.exit(0)).on(''error'',()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - iotn-network

  # ── Nextra Docs Site ─────────────────────────────────────────
  docs:
    container_name: rocky-docs
    build:
      context: .
      dockerfile: apps/docs/Dockerfile
    ports:
      - "3041:3002"
    restart: unless-stopped
    networks:
      - iotn-network

  drizzle-studio:
    image: ghcr.io/drizzle-team/gateway:latest
    container_name: drizzle-studio
    ports:
      - "4983:4983"
    volumes:
      - drizzle-gateway-data:/app
    environment:
      - DRIZZLE_MASTER_PASS=${DRIZZLE_MASTER_PASS}
      - MASTERPASS=${DRIZZLE_MASTER_PASS}
      - PORT=4983
      - STORE_PATH=/app
      # Drizzle Gateway reads the SAME single DATABASE_URL as the api.
      - DATABASE_URL=${DATABASE_URL}
    networks:
      - iotn-network
    restart: unless-stopped
    # profiles:
    # - dev

volumes:
  postgres_data:
  drizzle-gateway-data:

networks:
  iotn-network:
    external: true
    name: iotn_network
  app-network:
