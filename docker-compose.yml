version: "3.8"

services:
  # ── PostgreSQL + PostGIS ───────────────────────────────────────
  db:
    container_name: rokidb
    image: postgis/postgis:18-3.6-alpine
    # Local-dev DB only; external DB is used on deploy via DB_HOST in .env
    profiles: [local-db]
    environment:
      - POSTGRES_USER=tbot
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=tbot
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tbot -d tbot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # ── NestJS API (tRPC + better-auth) ──────────────────────────
  api:
    container_name: rocky-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    labels:
      - dockflare.enable=true
      - dockflare.hostname=api.${ROCKY_DOMAIN:-example.com}
      - dockflare.service=http://api:8080
      - dockflare.access.group=rocky-api
    environment:
      - NODE_ENV=production
      - PORT=8080
      - API_PORT=8080
      # Database — app + Postgres share the POSTGRES_PASSWORD secret
      - PG_HOST=${DB_HOST:-db}
      - PG_PORT=${DB_PORT:-5432}
      - PG_USER=tbot
      - PG_PASS=${POSTGRES_PASSWORD}
      - PG_DB=tbot
      # packages/database reads DATABASE_URL directly (PG_* is not forwarded)
      - DATABASE_URL=postgres://tbot:${POSTGRES_PASSWORD}@${DB_HOST:-db}:${DB_PORT:-5432}/tbot
      # Auth
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BASE_SERVICE_URL=http://api:8080
      - AUTH_BASE_URL=${AUTH_BASE_URL:-https://admin.${ROCKY_DOMAIN:-example.com}}
      # CORS: admin origin (browser). Override CORS_ORIGINS on a VM.
      - CORS_ORIGINS=${CORS_ORIGINS:-https://admin.${ROCKY_DOMAIN:-example.com}}
      - TRUSTED_ORIGINS=${TRUSTED_ORIGINS:-https://admin.${ROCKY_DOMAIN:-example.com},mobile://}
      # App
      - VERSION=${VERSION:-production}
      - ENVIRONMENT=production
    restart: unless-stopped
    networks:
      - app-network
      - cloudflare-net

  # ── Next.js Admin Panel ──────────────────────────────────────
  web:
    container_name: rocky-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Inlined at build (browser). Defaults to the Cloudflare api domain.
        - NEXT_PUBLIC_API_URL=${WEB_PUBLIC_API_URL:-https://api.${ROCKY_DOMAIN:-example.com}}
    labels:
      - dockflare.enable=true
      - dockflare.hostname=admin.${ROCKY_DOMAIN:-example.com}
      - dockflare.service=http://web:3000
      - dockflare.access.policy=authenticate
    environment:
      - NODE_ENV=production
      # SSR: Next.js server calls API via Docker internal network (RUNTIME)
      - API_URL=http://api:8080
      # Auth secret (same as API, for server-side session validation)
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      # Public base URL of the auth server (Cloudflare admin domain)
      - AUTH_BASE_URL=${AUTH_BASE_URL:-https://admin.${ROCKY_DOMAIN:-example.com}}
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - app-network
      - cloudflare-net

  # ── Nextra Docs Site ─────────────────────────────────────────
  docs:
    container_name: rocky-docs
    build:
      context: .
      dockerfile: apps/docs/Dockerfile
    labels:
      - dockflare.enable=true
      - dockflare.hostname=docs.${ROCKY_DOMAIN:-example.com}
      - dockflare.service=http://docs:3002
      - dockflare.access.policy=authenticate
    restart: unless-stopped
    networks:
      - app-network
      - cloudflare-net

  # ── Drizzle Studio (optional, dev only) ──────────────────────
  drizzle-studio:
    image: ghcr.io/drizzle-team/gateway:latest
    container_name: drizzle-studio
    ports:
      - "4983:4983"
    volumes:
      - drizzle-gateway-data:/app
    environment:
      - DRIZZLE_MASTER_PASS=${DRIZZLE_MASTER_PASS}
      - MASTERPASS=${DRIZZLE_MASTER_PASS}
      - PORT=4983
      - STORE_PATH=/app
    networks:
      - app-network
    restart: unless-stopped
    profiles:
      - dev

volumes:
  postgres_data:
  drizzle-gateway-data:

networks:
  app-network:
    driver: bridge
  cloudflare-net:
    name: cloudflare-net
    external: true
