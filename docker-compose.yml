# ── Domain model ─────────────────────────────────────────────
# ROCKY_DOMAIN is the TERTIARY root the app is served from, e.g.
# rocky.tehno.party. Hosts become api./admin./docs.ROCKY_DOMAIN.
#
# ── Security model ──────────────────────────────────────────
# No service exposes ports to the host. Every app container is
# reachable ONLY via the Cloudflare Tunnel (cloudflared), which
# joins the same bridge network and proxies by service name.
# Configure public hostnames in Cloudflare Zero Trust Dashboard
# > Networks > Tunnels > your-tunnel > Public Hostname.

services:
  # ── PostgreSQL + PostGIS ───────────────────────────────────────
  db:
    container_name: rokidb
    image: postgis/postgis:18-3.6-alpine
    # Local-dev DB only; external DB is used on deploy via DB_HOST in .env
    profiles: [local-db]
    environment:
      - POSTGRES_USER=tbot
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=tbot
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    # No ports: — DB is only reachable from within app-network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tbot -d tbot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # ── NestJS API (tRPC + better-auth) ──────────────────────────
  api:
    container_name: rocky-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # No ports: — reachable only via cloudflared tunnel.
    environment:
      - NODE_ENV=production
      - PORT=8080
      - API_PORT=8080
      # Database — app + Postgres share the POSTGRES_PASSWORD secret
      - PG_HOST=${DB_HOST:-db}
      - PG_PORT=${DB_PORT:-5432}
      - PG_USER=tbot
      - PG_PASS=${POSTGRES_PASSWORD}
      - PG_DB=tbot
      # packages/database reads DATABASE_URL directly (PG_* is not forwarded)
      - DATABASE_URL=postgres://tbot:${POSTGRES_PASSWORD}@${DB_HOST:-db}:${DB_PORT:-5432}/tbot
      # Auth
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      # Public API origin must be external https, not the internal docker host.
      # Better Auth derives the cookie domain from this; on a tertiary domain
      # (api.rocky.tehno.party) https is required for Secure shared cookies.
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-https://api.${ROCKY_DOMAIN:-rocky.tehno.party}}
      # Internal server-to-server base URL (Next.js SSR -> API).
      - BASE_SERVICE_URL=http://api:8080
      # Shared parent cookie domain: api./admin./docs. share the session.
      - AUTH_COOKIE_DOMAIN=${AUTH_COOKIE_DOMAIN:-.${ROCKY_DOMAIN:-rocky.tehno.party}}
      # Admin/public origin the browser runs on (CSRF + CORS trust).
      - AUTH_BASE_URL=${AUTH_BASE_URL:-https://admin.${ROCKY_DOMAIN:-rocky.tehno.party}}
      # CORS: admin origin (browser). Override CORS_ORIGINS on a VM.
      - CORS_ORIGINS=${CORS_ORIGINS:-https://admin.${ROCKY_DOMAIN:-rocky.tehno.party}}
      - TRUSTED_ORIGINS=${TRUSTED_ORIGINS:-https://admin.${ROCKY_DOMAIN:-rocky.tehno.party},mobile://}
      # App
      - VERSION=${VERSION:-production}
      - ENVIRONMENT=production
    restart: unless-stopped
    networks:
      - app-network

  # ── Next.js Admin Panel ──────────────────────────────────────
  web:
    container_name: rocky-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Inlined at build (browser). Defaults to the Cloudflare api domain.
        - NEXT_PUBLIC_API_URL=${WEB_PUBLIC_API_URL:-https://api.${ROCKY_DOMAIN:-rocky.tehno.party}}
    # No ports: — reachable only via cloudflared tunnel.
    environment:
      - NODE_ENV=production
      # SSR: Next.js server calls API via Docker internal network (RUNTIME)
      - API_URL=http://api:8080
      # Auth secret (same as API, for server-side session validation)
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      # Public base URL of the auth server (Cloudflare admin domain)
      - AUTH_BASE_URL=${AUTH_BASE_URL:-https://admin.${ROCKY_DOMAIN:-rocky.tehno.party}}
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - app-network

  # ── Nextra Docs Site ─────────────────────────────────────────
  docs:
    container_name: rocky-docs
    build:
      context: .
      dockerfile: apps/docs/Dockerfile
    # No ports: — reachable only via cloudflared tunnel.
    restart: unless-stopped
    networks:
      - app-network

  # ── Cloudflare Tunnel ─────────────────────────────────────────
  # Runs as a container on the same bridge network. No host ports
  # are published — this is the ONLY ingress. The TUNNEL_TOKEN is
  # obtained via the Cloudflare API (curl) and pasted into .env.
  # See .env.example section 5 for the exact curl commands.
  cloudflared:
    container_name: cloudflared
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    networks:
      - app-network
    depends_on:
      - api
      - web
      - docs

  # ── Drizzle Studio (optional, dev only) ──────────────────────
  drizzle-studio:
    image: ghcr.io/drizzle-team/gateway:latest
    container_name: drizzle-studio
    # No ports: — dev-only, no tunnel exposure needed.
    volumes:
      - drizzle-gateway-data:/app
    environment:
      - DRIZZLE_MASTER_PASS=${DRIZZLE_MASTER_PASS}
      - MASTERPASS=${DRIZZLE_MASTER_PASS}
      - PORT=4983
      - STORE_PATH=/app
    networks:
      - app-network
    restart: unless-stopped
    profiles:
      - dev

volumes:
  postgres_data:
  drizzle-gateway-data:

networks:
  app-network:
    driver: bridge
