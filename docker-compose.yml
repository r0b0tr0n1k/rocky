# ── Domain model ─────────────────────────────────────────────
# ROCKY_DOMAIN is the TERTIARY root the app is served from, e.g.
# techno.party. Hosts become api./admin./docs.ROCKY_DOMAIN.
#
# ── Security model ──────────────────────────────────────────
# Services expose ports to the host for local development.
# Every app container is also reachable via the Cloudflare Tunnel
# (cloudflared), which joins the same bridge network and proxies
# by service name. Configure public hostnames in Cloudflare Zero
# Trust Dashboard > Networks > Tunnels > your-tunnel > Public Hostname.

services:
  # ── PostgreSQL + PostGIS ───────────────────────────────────────
  db:
    container_name: rokidb
    image: postgis/postgis:18-3.6-alpine
    # Local-dev DB only; external DB is used on deploy via DB_HOST in .env
    profiles: [local-db]
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=tbot
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=tbot
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tbot -d tbot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # ── NestJS API (tRPC + better-auth) ──────────────────────────
  api:
    container_name: rocky-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - API_PORT=8080
      # Database — app + Postgres share the POSTGRES_PASSWORD secret
      - PG_HOST=${DB_HOST:-db}
      - PG_PORT=${DB_PORT:-5432}
      - PG_USER=tbot
      - PG_PASS=${POSTGRES_PASSWORD}
      - PG_DB=tbot
      # Drizzle ORM reads DATABASE_URL directly (packages/database/src/index.ts)
      - DATABASE_URL=postgres://tbot:${POSTGRES_PASSWORD}@${DB_HOST:-db}:${DB_PORT:-5432}/tbot
      # Auth
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      # Public API origin must be external https, not the internal docker host.
      # Better Auth derives the cookie domain from this; on a tertiary domain
      # (api.techno.party) https is required for Secure shared cookies.
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-https://api.techno.party}
      # Internal server-to-server base URL (Next.js SSR -> API).
      - BASE_SERVICE_URL=http://api:8080
      # Shared parent cookie domain: api./admin./docs. share the session.
      - AUTH_COOKIE_DOMAIN=${AUTH_COOKIE_DOMAIN:-.techno.party}
      # Admin/public origin the browser runs on (CSRF + CORS trust).
      - AUTH_BASE_URL=${AUTH_BASE_URL:-https://admin.techno.party}
      # CORS: admin origin (browser). Override CORS_ORIGINS on a VM.
      - CORS_ORIGINS=${CORS_ORIGINS:-https://admin.techno.party}
      - TRUSTED_ORIGINS=${TRUSTED_ORIGINS:-https://admin.techno.party,mobile://}
      # App
      - VERSION=${VERSION:-production}
      - ENVIRONMENT=production
      # MapTiler key: api generates server-side static maps/geocoding. The
      # single MapTiler key lives in .env as NEXT_PUBLIC_MAPTILER_API_KEY
      # (also inlined into the web build); alias it here rather than
      # duplicating the value as a second .env var.
      - MAPTILER_API_KEY=${NEXT_PUBLIC_MAPTILER_API_KEY}
    restart: unless-stopped
    networks:
      - app-network

  # ── Next.js Admin Panel ──────────────────────────────────────
  web:
    container_name: rocky-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Inlined at build (browser). Defaults to the Cloudflare api domain.
        - NEXT_PUBLIC_API_URL=${WEB_PUBLIC_API_URL:-https://api.techno.party}
    ports:
      - "3050:3000"
    environment:
      - NODE_ENV=production
      # SSR: Next.js server calls API via Docker internal network (RUNTIME)
      - API_URL=http://api:8080
      # Auth secret (same as API, for server-side session validation)
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      # Public base URL of the auth server (Cloudflare admin domain)
      - AUTH_BASE_URL=${AUTH_BASE_URL:-https://admin.techno.party}
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - app-network

  # ── Nextra Docs Site ─────────────────────────────────────────
  docs:
    container_name: rocky-docs
    build:
      context: .
      dockerfile: apps/docs/Dockerfile
    ports:
      - "3041:3000"
    restart: unless-stopped
    networks:
      - app-network

  drizzle-studio:
    image: ghcr.io/drizzle-team/gateway:latest
    container_name: drizzle-studio
    ports:
      - "4983:4983"
    volumes:
      - drizzle-gateway-data:/app
    environment:
      - DRIZZLE_MASTER_PASS=${DRIZZLE_MASTER_PASS}
      - MASTERPASS=${DRIZZLE_MASTER_PASS}
      - PORT=4983
      - STORE_PATH=/app
      # Drizzle Gateway connects to Postgres via DATABASE_URL.
      # Same DB_*/POSTGRES_PASSWORD source as the api service.
      - DATABASE_URL=postgres://tbot:${POSTGRES_PASSWORD}@${DB_HOST:-db}:${DB_PORT:-5432}/tbot
    networks:
      - app-network
    restart: unless-stopped
    profiles:
      - dev

volumes:
  postgres_data:
  drizzle-gateway-data:

networks:
  app-network:
    driver: bridge
